name: SNS automation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sns-automation.yml'
      - '.github/workflows/threads-social.yml'
      - '.github/workflows/x-social-drafts.yml'
      - 'scripts/social/**'
      - 'package.json'
      - 'package-lock.json'
      - 'OPERATIONS.md'
      - 'docs/sns-*.md'
  schedule:
    # GitHub-hosted X draft tick. Threads scheduled posting runs from Render
    # Cron Job `rashin-threads-scheduler` to avoid GitHub schedule delays.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Automation lane to run'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - threads
          - x

permissions:
  contents: read

concurrency:
  group: sns-automation
  cancel-in-progress: false

jobs:
  threads:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'auto' || github.event.inputs.mode == 'all' || github.event.inputs.mode == 'threads')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_ORIGIN: https://rashin-senjutsu.onrender.com
      THREADS_EXPECTED_USERNAME: sensai_teke
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      SOCIAL_AUTOMATED_POSTING_ENABLED: 'true'
      SOCIAL_PLATFORMS: threads
      SOCIAL_PAID_CTA_MODE: soft
      SOCIAL_BOOTH_ENABLED: 'false'
      SOCIAL_UTM_CAMPAIGN: 202605_prerelease
      SOCIAL_STATELESS_MODE: 'true'
      SOCIAL_SKIP_ORACLE_DATES: '2026-05-12'
      SOCIAL_POST_GRACE_MINUTES: '2'
      SOCIAL_THREADS_IMAGE_FALLBACK_TEXT: 'true'
      THREADS_CONTAINER_TIMEOUT_MS: '120000'
      THREADS_POST_VERIFY_TIMEOUT_MS: '120000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check posting secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "$THREADS_ACCESS_TOKEN" ] || [ -z "$THREADS_USER_ID" ]; then
            echo "::error::GitHub Secrets THREADS_ACCESS_TOKEN / THREADS_USER_ID are not set. Scheduled posting cannot run."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Validate scripts
        if: steps.secrets.outputs.ready == 'true'
        run: npm run check

      - name: Audit today's social draft
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          npm run social:audit -- --from="$today" --to="$today" --platforms=threads,bluesky,x

      - name: Confirm Threads token account
        if: steps.secrets.outputs.ready == 'true'
        run: npm run threads:doctor

      - name: Publish due Threads post
        if: steps.secrets.outputs.ready == 'true' && github.event_name != 'push'
        shell: bash
        run: node scripts/social/run-scheduled-posts.js --once --only-kind=all

  x-drafts:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'auto' || github.event.inputs.mode == 'all' || github.event.inputs.mode == 'x'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_ORIGIN: https://rashin-senjutsu.onrender.com
      SOCIAL_PLATFORMS: threads,bluesky,x
      SOCIAL_PAID_CTA_MODE: soft
      SOCIAL_BOOTH_ENABLED: 'false'
      SOCIAL_UTM_CAMPAIGN: 202605_prerelease
      SOCIAL_STATELESS_MODE: 'true'
      SOCIAL_ORACLE_CARD_MODE: random
      SOCIAL_X_DRAFT_GRACE_MINUTES: '60'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate scripts
        run: npm run check

      - name: Audit today's Threads/Bluesky/X drafts
        shell: bash
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          npm run social:audit -- --from="$today" --to="$today" --platforms=threads,bluesky,x

      - name: Export X draft artifacts
        shell: bash
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          args=(--date="$today" --kind=auto --out="x-drafts")
          if [ "${{ github.event_name }}" = "schedule" ]; then
            args+=(--due)
          fi
          node scripts/social/export-x-drafts.js "${args[@]}" | tee x-drafts-report.json

      - name: Require scheduled X draft output
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          status="$(node -e 'console.log(require("./x-drafts-report.json").status)')"
          if [ "$status" = "x_drafts_written" ] && ! compgen -G "x-drafts/*.md" > /dev/null; then
            echo "::error::Scheduled X draft run produced no draft files. Do not treat this as successful X operation."
            exit 1
          fi
          if [ "$status" = "no_due_x_drafts" ]; then
            echo "No X draft is due in this scheduled health run."
          fi

      - name: Add X drafts to workflow summary
        shell: bash
        run: |
          if compgen -G "x-drafts/*.md" > /dev/null; then
            {
              echo "# X posting drafts"
              echo
              echo "Open this summary on mobile, copy the text, open the image URL, attach the image, set alt text, then post in X."
              echo
              for file in x-drafts/*.md; do
                cat "$file"
                echo
                echo "---"
                echo
              done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# X posting drafts"
              echo
              echo "No X draft is due yet."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload X draft artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-drafts-${{ github.run_id }}
          path: x-drafts/
          if-no-files-found: ignore
