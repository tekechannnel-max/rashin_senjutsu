name: SNS automation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sns-automation.yml'
      - '.github/workflows/threads-social.yml'
      - '.env.example'
      - '.env.example.txt'
      - 'scripts/social/**'
      - 'package.json'
      - 'package-lock.json'
      - 'OPERATIONS.md'
      - 'docs/sns-*.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Automation lane to run'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - threads

permissions:
  contents: read

concurrency:
  group: sns-automation
  cancel-in-progress: false

jobs:
  threads:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'auto' || github.event.inputs.mode == 'all' || github.event.inputs.mode == 'threads')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_ORIGIN: https://rashin-senjutsu.onrender.com
      THREADS_EXPECTED_USERNAME: sensai_teke
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      INSTAGRAM_ENABLED: 'true'
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_EXPECTED_USERNAME: sensai_teke
      SOCIAL_AUTOMATED_POSTING_ENABLED: 'true'
      SOCIAL_PLATFORMS: threads,instagram
      SOCIAL_PAID_CTA_MODE: soft
      SOCIAL_BOOTH_ENABLED: 'false'
      SOCIAL_UTM_CAMPAIGN: 202605_prerelease
      SOCIAL_STATELESS_MODE: 'true'
      SOCIAL_CLOUD_SCHEDULER: 'true'
      SOCIAL_SKIP_ORACLE_DATES: '2026-05-12'
      SOCIAL_POST_GRACE_MINUTES: '59'
      SOCIAL_THREADS_IMAGE_FALLBACK_TEXT: 'true'
      THREADS_CONTAINER_TIMEOUT_MS: '120000'
      THREADS_POST_VERIFY_TIMEOUT_MS: '120000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check posting secrets
        id: secrets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$THREADS_ACCESS_TOKEN" ] || [ -z "$THREADS_USER_ID" ] || [ -z "$INSTAGRAM_ACCESS_TOKEN" ] || [ -z "$INSTAGRAM_USER_ID" ]; then
            echo "::error::GitHub Secrets for Threads / Instagram are not set. Scheduled posting cannot run."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Validate scripts
        if: github.event_name == 'push' || steps.secrets.outputs.ready == 'true'
        run: npm run check

      - name: Audit today's social draft
        if: github.event_name == 'push' || steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          npm run social:audit -- --from="$today" --to="$today" --platforms=threads,instagram

      - name: Confirm Threads token account
        if: github.event_name != 'push' && steps.secrets.outputs.ready == 'true'
        run: npm run threads:doctor

      - name: Confirm Instagram token account
        if: github.event_name != 'push' && steps.secrets.outputs.ready == 'true'
        run: npm run instagram:doctor

      - name: Publish due SNS post
        if: steps.secrets.outputs.ready == 'true' && github.event_name != 'push'
        shell: bash
        run: npm run social:cloud-run-due
