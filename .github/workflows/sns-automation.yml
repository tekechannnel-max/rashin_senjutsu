name: SNS automation

on:
  schedule:
    - cron: '30 15 * * *' # 00:30 JST, prepare next-day approved reels.
    - cron: '5 11-14 * * *' # 20:05-23:05 JST, post due approved reels.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sns-automation.yml'
      - '.github/workflows/instagram-reels-backup.yml'
      - '.env.example'
      - '.env.example.txt'
      - 'scripts/social/**'
      - 'package.json'
      - 'package-lock.json'
      - 'OPERATIONS.md'
      - 'docs/sns-*.md'
      - 'data/social-posts/approved-reels/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Automation lane to run'
        required: true
        default: 'validate'
        type: choice
        options:
          - validate
          - prepare_reels
          - post_reels
          - all

permissions:
  contents: write

concurrency:
  group: sns-automation-${{ github.event_name == 'schedule' && github.event.schedule || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'validate' || github.event.inputs.mode == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_ORIGIN: https://raw.githubusercontent.com/tekechannnel-max/rashin_senjutsu/refs/heads/main
      SOCIAL_AUTOMATED_POSTING_ENABLED: 'false'
      SOCIAL_PLATFORMS: threads,instagram
      SOCIAL_POST_GRACE_MINUTES: '59'
      SOCIAL_STATELESS_MODE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate application and SNS guardrails
        run: |
          npm run check
          npm run social:guard

      - name: Dry-run approved birthday reels
        run: npm run social:run-due -- --dry-run --only-kind=birthday_reel

  prepare-approved-reels:
    if: (github.event_name == 'schedule' && github.event.schedule == '30 15 * * *') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'prepare_reels' || github.event.inputs.mode == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      PUBLIC_ORIGIN: https://raw.githubusercontent.com/tekechannnel-max/rashin_senjutsu/refs/heads/main
      SOCIAL_AUTOMATION_BRANCH: main
      SOCIAL_PLATFORMS: threads,instagram
      SOCIAL_POST_GRACE_MINUTES: '59'
      SOCIAL_STATELESS_MODE: 'true'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare and publish next-day approved reels
        run: npm run social:auto-prepare-reels -- --days-ahead=1 --auto-approve --publish-to-git

      - name: Validate generated approved reels
        run: npm run social:guard

  post-approved-reels:
    if: (github.event_name == 'schedule' && github.event.schedule != '30 15 * * *') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'post_reels' || github.event.inputs.mode == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_ORIGIN: https://raw.githubusercontent.com/tekechannnel-max/rashin_senjutsu/refs/heads/main
      THREADS_EXPECTED_USERNAME: sensai_teke
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      INSTAGRAM_ENABLED: 'true'
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_EXPECTED_USERNAME: sensai_teke
      INSTAGRAM_API_VERSION: v23.0
      SOCIAL_AUTOMATED_POSTING_ENABLED: 'true'
      SOCIAL_PLATFORMS: threads,instagram
      SOCIAL_STATELESS_MODE: 'true'
      SOCIAL_CLOUD_SCHEDULER: 'true'
      SOCIAL_POST_GRACE_MINUTES: '59'
      SOCIAL_THREADS_IMAGE_FALLBACK_TEXT: 'true'
      THREADS_CONTAINER_TIMEOUT_MS: '120000'
      THREADS_POST_VERIFY_TIMEOUT_MS: '120000'
      INSTAGRAM_CONTAINER_TIMEOUT_MS: '600000'
      INSTAGRAM_CONTAINER_POLL_MS: '15000'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check posting secrets
        id: secrets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$THREADS_ACCESS_TOKEN" ] || [ -z "$THREADS_USER_ID" ] || [ -z "$INSTAGRAM_ACCESS_TOKEN" ] || [ -z "$INSTAGRAM_USER_ID" ]; then
            echo "::error::GitHub Secrets for Threads / Instagram are not set. Scheduled posting cannot run."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate scripts and guardrails
        if: steps.secrets.outputs.ready == 'true' && github.event_name != 'push'
        run: |
          npm run check
          npm run social:guard

      - name: Confirm Threads token account
        if: steps.secrets.outputs.ready == 'true' && github.event_name != 'push'
        run: npm run threads:doctor

      - name: Confirm Instagram token account
        if: steps.secrets.outputs.ready == 'true' && github.event_name != 'push'
        run: npm run instagram:doctor

      - name: Dry-run due approved birthday reels
        if: steps.secrets.outputs.ready == 'true' && github.event_name != 'push'
        run: npm run social:run-due -- --dry-run --only-kind=birthday_reel

      - name: Publish due approved birthday reels
        if: steps.secrets.outputs.ready == 'true' && github.event_name != 'push'
        run: npm run social:run-due -- --only-kind=birthday_reel
