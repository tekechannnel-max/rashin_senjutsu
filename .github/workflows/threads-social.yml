name: SNS social posts

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      kind:
        description: 'Post kind to run'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - oracle
          - empathy
          - question
          - difference
          - free_paid_compare

permissions:
  contents: read

concurrency:
  group: threads-social-${{ github.event.schedule || github.event.inputs.kind || 'manual' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_ORIGIN: https://rashin-senjutsu.onrender.com
      THREADS_EXPECTED_USERNAME: sensai_teke
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      INSTAGRAM_ENABLED: 'true'
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_EXPECTED_USERNAME: sensai_teke
      BLUESKY_IDENTIFIER: tekesensai.bsky.social
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      BLUESKY_EXPECTED_HANDLE: tekesensai.bsky.social
      SOCIAL_AUTOMATED_POSTING_ENABLED: 'true'
      SOCIAL_PLATFORMS: threads,bluesky,instagram
      SOCIAL_PAID_CTA_MODE: soft
      SOCIAL_BOOTH_ENABLED: 'false'
      SOCIAL_UTM_CAMPAIGN: 202605_prerelease
      SOCIAL_STATELESS_MODE: 'true'
      SOCIAL_SKIP_ORACLE_DATES: '2026-05-12'
      SOCIAL_POST_GRACE_MINUTES: '2'
      SOCIAL_THREADS_IMAGE_FALLBACK_TEXT: 'true'
      THREADS_CONTAINER_TIMEOUT_MS: '120000'
      THREADS_POST_VERIFY_TIMEOUT_MS: '120000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check posting secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "$THREADS_ACCESS_TOKEN" ] || [ -z "$THREADS_USER_ID" ] || [ -z "$INSTAGRAM_ACCESS_TOKEN" ] || [ -z "$INSTAGRAM_USER_ID" ] || [ -z "$BLUESKY_APP_PASSWORD" ]; then
            echo "::error::GitHub Secrets for Threads / Instagram / Bluesky are not set. Scheduled posting cannot run."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate scripts
        if: steps.secrets.outputs.ready == 'true'
        run: npm run check

      - name: Audit today's social draft
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          npm run social:audit -- --from="$today" --to="$today" --platforms=threads,bluesky,instagram

      - name: Confirm Threads token account
        if: steps.secrets.outputs.ready == 'true'
        run: npm run threads:doctor

      - name: Confirm Instagram token account
        if: steps.secrets.outputs.ready == 'true'
        run: npm run instagram:doctor

      - name: Confirm Bluesky token account
        if: steps.secrets.outputs.ready == 'true'
        run: npm run bluesky:doctor

      - name: Pick scheduled post kind
        if: steps.secrets.outputs.ready == 'true'
        id: pick
        shell: bash
        run: |
          kind="${{ github.event.inputs.kind || 'auto' }}"
          if [ "$kind" = "auto" ]; then
            case "${{ github.event.schedule }}" in
              *) kind="all" ;;
            esac
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Publish due SNS post
        if: steps.secrets.outputs.ready == 'true' && github.event_name != 'push'
        shell: bash
        run: |
          kind="${{ steps.pick.outputs.kind }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$kind" != "auto" ] && [ "$kind" != "all" ]; then
            node scripts/social/run-scheduled-posts.js --force-kind="$kind"
          else
            node scripts/social/run-scheduled-posts.js --once --only-kind="$kind"
          fi
