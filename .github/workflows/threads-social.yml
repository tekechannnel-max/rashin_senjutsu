name: SNS social posts

on:
  push:
    branches:
      - main
  schedule:
    # Backup scheduled posting ticks for 08:00, 20:00, 21:00, 22:00, and 23:00 JST.
    # GitHub schedule can start late, so run-scheduled-posts.js keeps a 59 minute grace window.
    - cron: '0 23,11,12,13,14 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Post kind to run'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - validate_only
          - all
          - oracle
          - rashin_point
          - rashin_point_thursday_20
          - birthday_monthly
          - birthday_monthly_01_08
          - birthday_monthly_09_16
          - birthday_monthly_17_24
          - birthday_monthly_25_31
          - birthday_monthly_recovery_01_08
          - birthday_monthly_recovery_09_16
          - birthday_monthly_recovery_17_24
          - birthday_monthly_recovery_25_31
          - birthday_ranking
          - birthday_ranking_love_at_first_sight
          - birthday_ranking_money_luck
          - birthday_ranking_horror_resistance
          - birthday_ranking_weird
          - birthday_ranking_idol_style
          - birthday_ranking_love_style
          - birthday_ranking_amae_jouzu
          - birthday_ranking_buchigire_kowai
          - birthday_ranking_20
          - birthday_ranking_21
          - birthday_ranking_22
          - birthday_ranking_23
          - birthday_ranking_love_at_first_sight
          - birthday_ranking_money_luck
          - birthday_ranking_horror_resistance
          - birthday_ranking_weird
          - birthday_ranking_idol_style
          - birthday_ranking_love_style
          - birthday_ranking_amae_jouzu
          - birthday_ranking_buchigire_kowai
          - birthday_ranking_akisho_level
          - birthday_ranking_majime
          - birthday_ranking_uwaki_rate
          - birthday_ranking_nenimotsu_wasureru
          - birthday_ranking_chuunibyou
          - birthday_ranking_birth_01_aruaru
          - birthday_ranking_birth_02_aruaru
          - birthday_ranking_birth_03_aruaru
          - birthday_ranking_birth_04_aruaru

permissions:
  contents: read

concurrency:
  group: threads-social-${{ github.event.schedule || github.event.inputs.kind || 'manual' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_ORIGIN: https://rashin-senjutsu.onrender.com
      THREADS_EXPECTED_USERNAME: sensai_teke
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      INSTAGRAM_ENABLED: 'true'
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_EXPECTED_USERNAME: sensai_teke
      SOCIAL_AUTOMATED_POSTING_ENABLED: 'true'
      SOCIAL_PLATFORMS: threads,instagram
      SOCIAL_ORACLE_TIME: '08:00'
      SOCIAL_PAID_CTA_MODE: soft
      SOCIAL_BOOTH_ENABLED: 'false'
      SOCIAL_UTM_CAMPAIGN: 202605_prerelease
      SOCIAL_STATELESS_MODE: 'true'
      SOCIAL_SKIP_ORACLE_DATES: '2026-05-12'
      SOCIAL_POST_GRACE_MINUTES: '59'
      SOCIAL_THREADS_IMAGE_FALLBACK_TEXT: 'true'
      THREADS_CONTAINER_TIMEOUT_MS: '120000'
      THREADS_POST_VERIFY_TIMEOUT_MS: '120000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check posting secrets
        id: secrets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$THREADS_ACCESS_TOKEN" ] || [ -z "$THREADS_USER_ID" ] || [ -z "$INSTAGRAM_ACCESS_TOKEN" ] || [ -z "$INSTAGRAM_USER_ID" ]; then
            echo "::error::GitHub Secrets for Threads / Instagram are not set. Scheduled posting cannot run."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate scripts
        if: github.event_name == 'push' || steps.secrets.outputs.ready == 'true'
        run: npm run check

      - name: Audit today's social draft
        if: github.event_name == 'push' || steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          npm run social:audit -- --from="$today" --to="$today" --platforms=threads,instagram

      - name: Confirm Threads token account
        if: github.event_name != 'push' && steps.secrets.outputs.ready == 'true'
        run: npm run threads:doctor

      - name: Confirm Instagram token account
        if: github.event_name != 'push' && steps.secrets.outputs.ready == 'true'
        run: npm run instagram:doctor

      - name: Pick scheduled post kind
        if: steps.secrets.outputs.ready == 'true'
        id: pick
        shell: bash
        run: |
          kind="${{ github.event.inputs.kind || 'auto' }}"
          if [ "$kind" = "auto" ]; then
            kind="all"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Publish due SNS post
        if: steps.secrets.outputs.ready == 'true' && github.event_name != 'push' && github.event.inputs.kind != 'validate_only'
        shell: bash
        run: |
          kind="${{ steps.pick.outputs.kind }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$kind" != "auto" ] && [ "$kind" != "all" ]; then
            node scripts/social/run-scheduled-posts.js --force-kind="$kind"
          else
            node scripts/social/run-scheduled-posts.js --once --only-kind="$kind"
          fi

      - name: Publish due Instagram birthday ranking reels
        if: steps.secrets.outputs.ready == 'true' && github.event_name != 'push' && github.event.inputs.kind != 'validate_only' && (github.event_name == 'schedule' || github.event.inputs.kind == 'auto' || github.event.inputs.kind == 'all')
        shell: bash
        env:
          SOCIAL_SCHEDULED_RUN: 'true'
          SOCIAL_REEL_POST_GRACE_MINUTES: '59'
          SOCIAL_REEL_CATCHUP_HOURS: '8'
          SOCIAL_REEL_PUBLIC_ORIGIN: https://raw.githubusercontent.com/tekechannnel-max/rashin_senjutsu/main
        run: node scripts/social/post-instagram-reels-20260609.js --post
