name: Threads social posts

on:
  schedule:
    # GitHub schedule can be delayed or dropped; run off the top of each hour
    # and let scripts/social/run-scheduled-posts.js decide whether a post is due.
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Post kind to run'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - oracle
          - concept
          - delete-post
      post_id:
        description: 'Threads post id to delete when kind=delete-post'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: threads-social-${{ github.event.schedule || github.event.inputs.kind || 'manual' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_ORIGIN: https://rashin-senjutsu.onrender.com
      THREADS_EXPECTED_USERNAME: sensai_teke
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      SOCIAL_AUTOMATED_POSTING_ENABLED: 'true'
      SOCIAL_PLATFORMS: threads
      SOCIAL_PAID_CTA_MODE: soft
      SOCIAL_RELEASE_MODE: prelaunch
      SOCIAL_BOOTH_ENABLED: 'false'
      SOCIAL_UTM_CAMPAIGN: 202605_prerelease
      SOCIAL_STATELESS_MODE: 'true'
      SOCIAL_SKIP_ORACLE_DATES: '2026-05-12'
      SOCIAL_THREADS_IMAGE_FALLBACK_TEXT: 'true'
      THREADS_CONTAINER_TIMEOUT_MS: '120000'
      THREADS_POST_VERIFY_TIMEOUT_MS: '120000'
      THREADS_DELETE_POST_ID: ${{ github.event.inputs.post_id || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check posting secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "$THREADS_ACCESS_TOKEN" ] || [ -z "$THREADS_USER_ID" ]; then
            echo "GitHub Secrets THREADS_ACCESS_TOKEN / THREADS_USER_ID are not set. Skipping post."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate scripts
        if: steps.secrets.outputs.ready == 'true'
        run: npm run check

      - name: Confirm Threads token account
        if: steps.secrets.outputs.ready == 'true'
        run: npm run threads:doctor

      - name: Pick scheduled post kind
        if: steps.secrets.outputs.ready == 'true'
        id: pick
        shell: bash
        run: |
          kind="${{ github.event.inputs.kind || 'auto' }}"
          if [ "$kind" = "auto" ]; then
            case "${{ github.event.schedule }}" in
              *) kind="all" ;;
            esac
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Publish due Threads post
        if: steps.secrets.outputs.ready == 'true' && steps.pick.outputs.kind != 'delete-post'
        run: node scripts/social/run-scheduled-posts.js --once --only-kind=${{ steps.pick.outputs.kind }}

      - name: Delete Threads post
        if: steps.secrets.outputs.ready == 'true' && steps.pick.outputs.kind == 'delete-post'
        run: |
          if [ -z "$THREADS_DELETE_POST_ID" ]; then
            echo "post_id is required when kind=delete-post."
            exit 1
          fi
          node scripts/social/threads-tool.js delete-post --id="$THREADS_DELETE_POST_ID" --yes
