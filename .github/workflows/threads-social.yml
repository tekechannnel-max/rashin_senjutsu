name: SNS social posts

on:
  push:
    branches:
      - main
  schedule:
    # Cloud backup ticks for 08:00 and 20:00-22:00 JST, plus 23:00 JST recovery sweeps.
    # GitHub schedule can start late or drop individual ticks, so keep multiple off-hour retries.
    - cron: '5,20,35,50 23,11,12,13,14 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Post kind to run'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - validate_only
          - all
          - oracle

permissions:
  contents: read

concurrency:
  group: threads-social-${{ github.event.schedule || github.event.inputs.kind || 'manual' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_ORIGIN: https://rashin-senjutsu.onrender.com
      THREADS_EXPECTED_USERNAME: sensai_teke
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      INSTAGRAM_ENABLED: 'true'
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_EXPECTED_USERNAME: sensai_teke
      SOCIAL_AUTOMATED_POSTING_ENABLED: 'true'
      SOCIAL_PLATFORMS: threads,instagram
      SOCIAL_ORACLE_TIME: '08:00'
      SOCIAL_PAID_CTA_MODE: soft
      SOCIAL_BOOTH_ENABLED: 'false'
      SOCIAL_UTM_CAMPAIGN: 202605_prerelease
      SOCIAL_STATELESS_MODE: 'true'
      SOCIAL_SKIP_ORACLE_DATES: '2026-05-12'
      SOCIAL_POST_GRACE_MINUTES: '59'
      SOCIAL_REEL_POST_GRACE_MINUTES: '59'
      SOCIAL_REEL_CATCHUP_HOURS: '8'
      SOCIAL_REEL_PUBLIC_ORIGIN: https://raw.githubusercontent.com/tekechannnel-max/rashin_senjutsu/main
      SOCIAL_CLOUD_SCHEDULER: 'true'
      SOCIAL_THREADS_IMAGE_FALLBACK_TEXT: 'true'
      INSTAGRAM_CONTAINER_TIMEOUT_MS: '600000'
      INSTAGRAM_CONTAINER_POLL_MS: '15000'
      THREADS_CONTAINER_TIMEOUT_MS: '120000'
      THREADS_POST_VERIFY_TIMEOUT_MS: '120000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check posting secrets
        id: secrets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$THREADS_ACCESS_TOKEN" ] || [ -z "$THREADS_USER_ID" ] || [ -z "$INSTAGRAM_ACCESS_TOKEN" ] || [ -z "$INSTAGRAM_USER_ID" ]; then
            echo "::error::GitHub Secrets for Threads / Instagram are not set. Scheduled posting cannot run."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate scripts
        if: github.event_name == 'push' || steps.secrets.outputs.ready == 'true'
        run: npm run check

      - name: Audit today's social draft
        if: github.event_name == 'push' || steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          npm run social:audit -- --from="$today" --to="$today" --platforms=threads,instagram

      - name: Confirm Threads token account
        if: github.event_name != 'push' && steps.secrets.outputs.ready == 'true'
        run: npm run threads:doctor

      - name: Confirm Instagram token account
        if: github.event_name != 'push' && steps.secrets.outputs.ready == 'true'
        run: npm run instagram:doctor

      - name: Pick scheduled post kind
        if: steps.secrets.outputs.ready == 'true'
        id: pick
        shell: bash
        run: |
          kind="${{ github.event.inputs.kind || 'auto' }}"
          if [ "$kind" = "auto" ]; then
            kind="all"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Publish due SNS post
        if: steps.secrets.outputs.ready == 'true' && github.event_name != 'push' && github.event.inputs.kind != 'validate_only'
        shell: bash
        run: |
          kind="${{ steps.pick.outputs.kind }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$kind" = "auto" ] || [ "$kind" = "all" ]; then
            npm run social:cloud-run-due
          elif [ "$kind" = "oracle" ]; then
            node scripts/social/run-scheduled-posts.js --force-kind=oracle
          else
            echo "Night image posting is disabled; skipped SNS image kind: $kind"
          fi

      - name: Verify due birthday reels
        if: always() && steps.secrets.outputs.ready == 'true' && github.event_name != 'push' && github.event.inputs.kind != 'validate_only' && (github.event_name == 'schedule' || github.event.inputs.kind == 'auto' || github.event.inputs.kind == 'all')
        run: node scripts/social/post-daily-birthday-reels.js --verify-only --platforms=threads,instagram
