name: X social drafts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/x-social-drafts.yml'
      - 'scripts/social/**'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    # 07:03 JST. This workflow is the visible manual-post X draft lane.
    - cron: '3 22 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Draft kind to export'
        required: true
        default: 'oracle'
        type: choice
        options:
          - auto
          - oracle
          - midday
          - concept
          - all

permissions:
  contents: read

concurrency:
  group: x-social-drafts-${{ github.event.schedule || github.event.inputs.kind || 'manual' }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_ORIGIN: https://rashin-senjutsu.onrender.com
      SOCIAL_PLATFORMS: threads,bluesky,x
      SOCIAL_PAID_CTA_MODE: soft
      SOCIAL_BOOTH_ENABLED: 'false'
      SOCIAL_UTM_CAMPAIGN: 202605_prerelease
      SOCIAL_STATELESS_MODE: 'true'
      SOCIAL_ORACLE_CARD_MODE: random
      SOCIAL_X_DRAFT_GRACE_MINUTES: '60'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate scripts
        run: npm run check

      - name: Audit today's Threads/Bluesky/X drafts
        shell: bash
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          npm run social:audit -- --from="$today" --to="$today" --platforms=threads,bluesky,x

      - name: Export X draft artifacts
        shell: bash
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          kind="${{ github.event.inputs.kind || 'oracle' }}"
          args=(--date="$today" --kind="$kind" --out="x-drafts")
          node scripts/social/export-x-drafts.js "${args[@]}" | tee x-drafts-report.json

      - name: Require X draft output
        if: github.event_name == 'schedule' || github.event_name == 'push'
        shell: bash
        run: |
          status="$(node -e 'console.log(require("./x-drafts-report.json").status)')"
          if [ "$status" != "x_drafts_written" ] || ! compgen -G "x-drafts/*.md" > /dev/null; then
            echo "::error::X draft run produced no draft files. Do not treat this as successful X operation."
            exit 1
          fi

      - name: Add X drafts to workflow summary
        shell: bash
        run: |
          if compgen -G "x-drafts/*.md" > /dev/null; then
            {
              echo "# X posting drafts"
              echo
              echo "Open this summary on mobile, copy the text, open the image URL, attach the image, set alt text, then post in X."
              echo
              for file in x-drafts/*.md; do
                cat "$file"
                echo
                echo "---"
                echo
              done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# X posting drafts"
              echo
              echo "No X draft is due yet."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload X draft artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-drafts-${{ github.run_id }}
          path: x-drafts/
          if-no-files-found: ignore
