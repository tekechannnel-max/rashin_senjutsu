name: X social drafts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/x-social-drafts.yml'
      - 'scripts/social/**'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    # 07:03 JST. X Web draft lane for the morning oracle post.
    - cron: '3 22 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Draft kind to export'
        required: true
        default: 'oracle'
        type: choice
        options:
          - auto
          - oracle
          - all

permissions:
  contents: read

concurrency:
  group: x-social-drafts-${{ github.event.schedule || github.event.inputs.kind || 'manual' }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_ORIGIN: https://rashin-senjutsu.onrender.com
      SOCIAL_PLATFORMS: threads,bluesky,x
      SOCIAL_PAID_CTA_MODE: soft
      SOCIAL_BOOTH_ENABLED: 'false'
      SOCIAL_UTM_CAMPAIGN: 202605_prerelease
      SOCIAL_STATELESS_MODE: 'true'
      SOCIAL_ORACLE_CARD_MODE: random
      SOCIAL_X_DRAFT_GRACE_MINUTES: '60'
      X_AUTH_STORAGE_BASE64: ${{ secrets.X_AUTH_STORAGE_BASE64 }}
      X_AUTH_STORAGE_JSON: ${{ secrets.X_AUTH_STORAGE_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate scripts
        run: npm run check

      - name: Audit today's Threads/Bluesky/X drafts
        shell: bash
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          npm run social:audit -- --from="$today" --to="$today" --platforms=threads,bluesky,x

      - name: Select X draft target
        id: x-target
        shell: bash
        run: |
          today="$(TZ=Asia/Tokyo date +%F)"
          case "${{ github.event.schedule }}" in
            "3 22 * * *") kind="oracle" ;;
            *) kind="${{ github.event.inputs.kind || 'oracle' }}" ;;
          esac
          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Export X draft artifacts
        shell: bash
        run: |
          args=(--date="${{ steps.x-target.outputs.today }}" --kind="${{ steps.x-target.outputs.kind }}" --out="x-drafts")
          node scripts/social/export-x-drafts.js "${args[@]}" | tee x-drafts-report.json

      - name: Require X draft output
        if: github.event_name == 'schedule' || github.event_name == 'push'
        shell: bash
        run: |
          status="$(node -e 'console.log(require("./x-drafts-report.json").status)')"
          if [ "$status" != "x_drafts_written" ] || ! compgen -G "x-drafts/*.md" > /dev/null; then
            echo "::error::X draft run produced no draft files. Do not treat this as successful X operation."
            exit 1
          fi

      - name: Install Playwright Chromium
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium

      - name: Save X Web draft
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ -z "$X_AUTH_STORAGE_BASE64" ] && [ -z "$X_AUTH_STORAGE_JSON" ]; then
            echo "::error::Set GitHub Actions secret X_AUTH_STORAGE_BASE64. This workflow cannot save an X Web draft without an authenticated X browser session."
            exit 1
          fi
          node scripts/social/save-x-web-draft.js --date="${{ steps.x-target.outputs.today }}" --kind="${{ steps.x-target.outputs.kind }}" --out="x-web-drafts" | tee x-web-drafts-report.json

      - name: Upload X Web draft debug artifacts
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: x-web-drafts-${{ github.run_id }}
          path: |
            x-web-drafts/
            x-web-drafts-report.json
          if-no-files-found: ignore

      - name: Add X drafts to workflow summary
        shell: bash
        run: |
          if compgen -G "x-drafts/*.md" > /dev/null; then
            {
              echo "# X posting drafts"
              echo
              echo "Open this summary on mobile, copy the text, open the image URL, attach the image, set alt text, then post in X."
              echo
              for file in x-drafts/*.md; do
                cat "$file"
                echo
                echo "---"
                echo
              done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# X posting drafts"
              echo
              echo "No X draft is due yet."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload X draft artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x-drafts-${{ github.run_id }}
          path: x-drafts/
          if-no-files-found: ignore
