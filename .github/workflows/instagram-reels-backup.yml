name: Instagram reels backup

on:
  schedule:
    # Backup ticks for Instagram Reels at 20:00, 21:00, 22:00, and 23:00 JST.
    # Run away from the top of the hour because GitHub scheduled workflows can
    # be delayed or skipped when the hourly queue is congested.
    - cron: '17,32,47 11,12,13,14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - validate_only

permissions:
  contents: read

concurrency:
  group: instagram-reels-backup-${{ github.event.schedule || github.event.inputs.mode || 'manual' }}
  cancel-in-progress: false

jobs:
  post-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      INSTAGRAM_ENABLED: 'true'
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_EXPECTED_USERNAME: sensai_teke
      SOCIAL_AUTOMATED_POSTING_ENABLED: 'true'
      SOCIAL_SCHEDULED_RUN: 'true'
      SOCIAL_REEL_POST_GRACE_MINUTES: '59'
      SOCIAL_REEL_PUBLIC_ORIGIN: https://raw.githubusercontent.com/tekechannnel-max/rashin_senjutsu/main
      INSTAGRAM_CONTAINER_TIMEOUT_MS: '600000'
      INSTAGRAM_CONTAINER_POLL_MS: '15000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Instagram posting secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ] || [ -z "$INSTAGRAM_USER_ID" ]; then
            echo "::error::GitHub Secrets for Instagram are not set. Reels backup posting cannot run."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Validate Instagram token account
        if: steps.secrets.outputs.ready == 'true'
        run: npm run instagram:doctor

      - name: Dry-run due Instagram reels
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/social/post-instagram-reels-20260609.js --dry-run

      - name: Publish due Instagram reels
        if: steps.secrets.outputs.ready == 'true' && github.event.inputs.mode != 'validate_only'
        run: node scripts/social/post-instagram-reels-20260609.js --post
