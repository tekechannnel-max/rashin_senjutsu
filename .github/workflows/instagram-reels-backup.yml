name: Instagram reels backup validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/instagram-reels-backup.yml
      - .github/workflows/sns-automation.yml
      - data/social-posts/approved-reels/**
      - scripts/social/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-reels-backup-validation
  cancel-in-progress: false

jobs:
  validate-approved-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_ORIGIN: https://rashin-senjutsu.onrender.com
      SOCIAL_AUTOMATED_POSTING_ENABLED: 'false'
      SOCIAL_PLATFORMS: threads,instagram
      SOCIAL_POST_GRACE_MINUTES: '59'
      SOCIAL_STATELESS_MODE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Validate application and SNS guardrails
        run: |
          npm run check
          npm run social:guard

      - name: Dry-run approved birthday reels
        run: npm run social:run-due -- --dry-run --only-kind=birthday_reel
