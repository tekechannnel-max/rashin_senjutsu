<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羅針占術 ローカルカードドロー</title>
<style>
:root{--bg:#070813;--panel:rgba(12,14,30,.86);--gold:#d7af55;--cream:#f0ead8;--muted:rgba(240,234,216,.64);--line:rgba(215,175,85,.25);}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 8%,rgba(57,89,143,.34),transparent 34%),radial-gradient(circle at 78% 12%,rgba(148,98,177,.28),transparent 32%),linear-gradient(180deg,#070813,#09070f 72%,#05050a);color:var(--cream);font-family:"Yu Gothic","Meiryo",sans-serif;}
main{width:min(1120px,calc(100% - 28px));margin:0 auto;padding:28px 0 40px;}
.head{display:flex;justify-content:space-between;gap:18px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px;}
.kicker{font-size:11px;letter-spacing:.18em;color:var(--gold);}
h1{font-family:"Yu Mincho","Shippori Mincho",serif;font-weight:500;font-size:clamp(26px,5vw,42px);letter-spacing:.08em;margin:8px 0 0;}
.note{max-width:34em;font-size:13px;line-height:1.9;color:var(--muted);}
.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:rgba(7,8,19,.86);backdrop-filter:blur(10px);border:1px solid var(--line);padding:12px;margin-bottom:18px;}
button,select{height:42px;border:1px solid rgba(215,175,85,.34);background:rgba(255,255,255,.035);color:var(--cream);padding:0 14px;font:inherit;letter-spacing:.06em;}
button{cursor:pointer}
button.primary{background:linear-gradient(135deg,rgba(215,175,85,.95),rgba(126,83,18,.94));color:#160f05;border-color:rgba(255,236,178,.55);font-weight:700;}
button:hover{filter:brightness(1.08)}
select{min-width:160px}
.spread{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.card{background:var(--panel);border:1px solid var(--line);padding:12px;box-shadow:0 18px 52px rgba(0,0,0,.32);}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#111;border:1px solid rgba(255,255,255,.08);}
.card-no{font-size:10px;letter-spacing:.18em;color:#92d2cf;margin-top:11px;}
.card-name{font-family:"Yu Mincho","Shippori Mincho",serif;color:var(--gold);font-size:17px;line-height:1.5;margin-top:4px;}
.card-copy{font-size:12px;line-height:1.75;color:var(--muted);margin-top:8px;}
.empty{border:1px dashed var(--line);padding:32px;text-align:center;color:var(--muted);line-height:1.8;}
@media(max-width:720px){.head{display:block}.toolbar{position:static}.toolbar>*{flex:1 1 140px}.spread{grid-template-columns:repeat(auto-fit,minmax(128px,1fr));}}
</style>
</head>
<body>
<main>
  <div class="head">
    <div>
      <div class="kicker">LOCAL ONLY</div>
      <h1>カードだけ引く</h1>
    </div>
    <div class="note">TikTok LIVEなどで使うローカル専用のカードドロー画面です。AI鑑定・ログイン・課金は動きません。既存のカード画像だけを使います。</div>
  </div>
  <div class="toolbar">
    <select id="deck">
      <option value="oracle">数秘オラクル</option>
      <option value="lenormand">ルノルマン</option>
    </select>
    <button class="primary" onclick="drawCards(1)">1枚引く</button>
    <button onclick="drawCards(3)">3枚引く</button>
    <button onclick="drawCards(9)">9枚引く</button>
    <button onclick="clearCards()">クリア</button>
  </div>
  <div id="spread" class="spread">
    <div class="empty">デッキを選んでカードを引いてください。</div>
  </div>
</main>
<script>
const LENORMAND=[
  ['騎士','吉報・新しい出会い・素早い展開'],['クローバー','小さな幸運・チャンス'],['船','移動・遠方・新しい冒険'],['家','安心・家族・基盤'],['樹木','成長・健康・時間'],['雲','不安・曖昧さ・混乱'],['蛇','複雑さ・嫉妬・警戒'],['棺','終わり・変化・区切り'],['花束','喜び・魅力・贈り物'],['鎌','決断・切断・突然の変化'],['鞭','議論・繰り返し・摩擦'],['鳥','会話・噂・SNS'],['子ども','新しさ・未熟さ・小さな始まり'],['キツネ','警戒・策略・仕事'],['熊','力・保護・影響力'],['星','希望・理想・見通し'],['コウノトリ','変化・移動・改善'],['犬','信頼・友情・支援者'],['塔','自立・組織・距離'],['庭園','人脈・場・コミュニティ'],['山','障害・遅延・壁'],['道','選択・分岐・迷い'],['ネズミ','消耗・損失・ストレス'],['ハート','愛情・情熱・好意'],['指輪','約束・契約・絆'],['本','秘密・知識・未発見'],['手紙','連絡・知らせ・書類'],['紳士','男性・本人軸・重要人物'],['淑女','女性・本人軸・重要人物'],['百合','成熟・平和・年長者'],['太陽','成功・活力・明るさ'],['月','直感・感情・評判'],['鍵','解決・重要点・突破口'],['魚','豊かさ・お金・流れ'],['錨','安定・継続・仕事'],['十字架','重責・試練・価値観']
].map((item,index)=>({id:index+1,name:item[0],copy:item[1],deck:'lenormand'}));

const ORACLE=[
  [1,'The Guide','最初の火を灯す日','自分の中の道しるべを信じる日。'],[2,'The Supporter','静かに支える日','無理なく支える日。'],[3,'The Innocent','軽さを取り戻す日','軽さが本音を連れてくる日。'],[4,'The Diligent','土台を締める日','足元を整える日。'],[5,'The Adventurer','小さく冒険する日','小さな冒険が流れを動かす日。'],[6,'The Caregiver','優しさの向きを整える日','自分も優しさの輪に入れる日。'],[7,'The Artisan','深く磨く日','自分の質を磨く日。'],[8,'The Warrior','力の使い道を決める日','力の使い道を決める日。'],[9,'The Sage','手放して見晴らす日','手放すほど見えてくる日。'],[10,'The Great Power','再起動の合図を受け取る日','新しい入口を見つける日。'],[11,'The Inspired One','ひらめきを地上に降ろす日','ひらめきを形にする日。'],[12,'The Harmonizer','間に余白を作る日','間に余白を作る日。'],[13,'The Wise King','古い型を改める日','古い型を更新する日。'],[14,'The Transformer','混ぜ直して整える日','ちょうどいい配合を探す日。'],[15,'The Servant','動機を澄ませる日','動機を澄ませる日。'],[16,'The Perceptive One','違和感を尊重する日','違和感を見過ごさない日。'],[17,'The Benefactor','希望を渡す日','小さな希望を渡す日。'],[18,'The Seeker','霧の中を確かめる日','霧の中で事実を拾う日。'],[19,'The Unwavering One','光を曲げない日','自分の光を曲げない日。'],[20,'The Unifier','呼び戻される声を聞く日','過去の学びを今に戻す日。'],[21,'The Completer','美しく終える日','美しく終える日。'],[22,'The Charism','大きな器を小さく築く日','誠実な一手が影響力になる日。'],[23,'The Flowrider','流れを読み替える日','予定外の流れを味方にする日。'],[24,'The Gracebearer','品よく伝える日','柔らかさが力になる日。'],[25,'The Wayfarer','自分の歩幅に戻る日','自分の歩幅に戻る日。'],[26,'The Trailblazer','未舗装の道を試す日','未舗装の道を試す日。'],[27,'The Gatewalker','次の扉の前で整える日','次の扉の前で整える日。'],[28,'The Resonator','響き合う場を選ぶ日','響き合う場を選ぶ日。'],[29,'The Visionweaver','理想を手に届かせる日','理想を一手に編み込む日。'],[30,'The Creator','形にして残す日','ひらめきを形にして残す日。'],[31,'The Architect','設計図を引く日','設計図を引く日。'],[32,'The Collaborator','共に動かす日','ひとりで抱えず共に動かす日。'],[33,'The Awakened','満たしてから与える日','自分の灯を守ってから照らす日。']
].map(item=>({id:item[0],name:item[1],title:item[2],copy:item[3],deck:'oracle'}));

function shuffle(list){
  const copy=[...list];
  for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}
  return copy;
}
function imagePath(card){
  return `images/cards/${card.deck==='oracle'?'oracle':'lenormand'}/${String(card.id).padStart(2,'0')}.jpg`;
}
function drawCards(count){
  const deck=document.getElementById('deck').value;
  const pool=deck==='oracle'?ORACLE:LENORMAND;
  const picked=shuffle(pool).slice(0,count);
  document.getElementById('spread').innerHTML=picked.map(card=>`
    <article class="card">
      <img src="${imagePath(card)}" alt="${card.name}" onerror="this.style.display='none'">
      <div class="card-no">No.${String(card.id).padStart(2,'0')}</div>
      <div class="card-name">${card.name}</div>
      ${card.title?`<div class="card-copy">${card.title}</div>`:''}
      <div class="card-copy">${card.copy}</div>
    </article>
  `).join('');
}
function clearCards(){
  document.getElementById('spread').innerHTML='<div class="empty">デッキを選んでカードを引いてください。</div>';
}
</script>
</body>
</html>
